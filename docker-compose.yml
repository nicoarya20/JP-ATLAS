# Optional local Postgres for the Simple PM template.
#
# You already run a shared Postgres (infra-postgres / pgvector on :5432), so by
# default this file does NOTHING unless you opt in with the `local-db` profile:
#
#   docker compose --profile local-db up -d
#
# The runtime image (Dockerfile) runs `migrate` (when DATABASE_URL is set) and then `start`, so an
# external database is migrated on every container boot. With several app replicas, run it once as a job instead:
#   docker run --rm --env-file .env <image> bun run server/binary-entry.ts migrate
# and start the replicas with `bun run server/binary-entry.ts start`.
# Check pending migrations without applying them: append `migrate --status`.
#
# If you use the shared instance instead, just point DATABASE_URL at it and
# create the database once:
#   docker exec <your-postgres> psql -U <user> -d postgres -c "CREATE DATABASE simple_pm;"

services:
  db:
    profiles: ['local-db']
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: simple_pm
      POSTGRES_PASSWORD: simple_pm
      POSTGRES_DB: simple_pm
    ports:
      - '5432:5432'
    volumes:
      - simple_pm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simple_pm -d simple_pm']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  simple_pm_pgdata:

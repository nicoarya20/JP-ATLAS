="932.4" font-family="Manrope,Arial,sans-serif" font-size="20" font-weight="400" fill="#4c6075">Modal</text><rect x="588" y="820" width="132" height="78" rx="20" fill="#eaf0f6" stroke="#697d92" stroke-width="1"/><text x="606" y="864.68" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="500" fill="#122236">20 px</text><text x="594" y="932.4" font-family="Manrope,Arial,sans-serif" font-size="20" font-weight="400" fill="#4c6075">Identity</text><rect x="822" y="270" width="690" height="730" rx="14" fill="#071321" stroke="none" stroke-width="1"/><text x="854" y="322.04" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="600" fill="#b6b4ff">ISI PAKET</text><text x="854" y="388.14" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="600" fill="#f3f6fb">01 / Logo</text><text x="854" y="424.04" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="400" fill="#b7c4d3">PNG master transparan + favicon</text><text x="854" y="479.14" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="600" fill="#f3f6fb">02 / Typography</text><text x="854" y="515.04" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="400" fill="#b7c4d3">Manrope variable + lisensi OFL</text><text x="854" y="570.14" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="600" fill="#f3f6fb">03 / Tokens</text><text x="854" y="606.04" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="400" fill="#b7c4d3">JSON, CSS, CSV dan cek kontras</text><text x="854" y="661.14" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="600" fill="#f3f6fb">04 / Editable boards</text><text x="854" y="697.04" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="400" fill="#b7c4d3">6 lembar SVG dengan teks editable</text><text x="854" y="752.14" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="600" fill="#f3f6fb">05 / Handoff</text><text x="854" y="788.04" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="400" fill="#b7c4d3">Panduan, provenance dan manifest</text><text x="854" y="868.04" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="400" fill="#b7c4d3">Basis: kandidat desain v0.1. Nilai token adalah acuan kerja;</text><text x="854" y="901.04" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="400" fill="#b7c4d3">adopsi ke aplikasi dan ukuran logo akhir tetap perlu review</text><text x="854" y="934.04" font-family="Manrope,Arial,sans-serif" font-size="22" font-weight="400" fill="#b7c4d3">tim.</text><text x="88" y="1042.22" font-family="Manrope,Arial,sans-serif" font-size="21" font-weight="400" fill="#4c6075">Cek aksesibilitas terbatas pada pasangan warna solid; bukan sertifikasi seluruh UI.</text><line x1="88" y1="1060" x2="1512" y2="1060" stroke="#c7d2df" stroke-width="1"/><text x="88" y="1094.76" font-family="Manrope,Arial,sans-serif" font-size="18" font-weight="500" fill="#4c6075">INTERNAL HANDOFF v1.0  |  21 OKTOBER 2026</text><text x="1080" y="1094.76" font-family="Manrope,Arial,sans-serif" font-size="18" font-weight="500" fill="#4c6075">JP ATLAS  /  06 OF 06</text></svg>